<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="fatmax">
  <!--
    fatmax のアイコン。ベルがモチーフ（止まったら音でも知らせる、UI の 🔔 と同じ絵）。
    輪郭は1本の面（土台の帯や上のつまみを別パーツで積まない）。継ぎ目や、
    上下に同じ色の粒が並ぶ「目鼻」に見える安っぽさを避けるため

    # 3色・本体は対角線で塗り分け

    黄を細い合図だけに使うと面積が小さく、16px でほぼ消える。輪郭の内側を
    1本の対角線で青と黄に割ることで、小さいサイズでも一目で3色構成と分かる。
    振り子は独立した3色目（橙）。本体が2色になっても鳴らす部分だけは差し色のまま残す

    色は UI の series-1（青）・warning（黄）・series-2（橙）が元だが、暗いタイルの
    上では UI そのままの値だと沈むため、アイコン用に明度を上げてある
    （実際に並べて見比べて決めている。推測で決めていない）

    # 16px に合わせて決めてある

    favicon は 16px まで縮む。**そこで潰れないことを最優先**にした。
    実際に 16/24/32/64/128 を並べて見比べて決めている

    # 背景を自前で持つ理由

    透過にすると、ダークのタブでは濃い青と黒が沈んで輪郭が消える。
    タイルを敷けばライトでもダークでも同じに見える。
  -->
  <defs>
    <clipPath id="bellclip">
      <path d="M32 13
        C 23 13 18 21 18 32
        C 18 38 16.5 41.5 13.5 44.5
        C 12.7 45.3 13.3 47 15 47
        L 49 47
        C 50.7 47 51.3 45.3 50.5 44.5
        C 47.5 41.5 46 38 46 32
        C 46 21 41 13 32 13 Z"/>
    </clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="#1a1a19"/>
  <g clip-path="url(#bellclip)">
    <rect x="12" y="12" width="40" height="36" fill="#4d96ff"/>
    <polygon points="12,12 52,12 52,48" fill="#ffcc00"/>
  </g>
  <circle cx="32" cy="52.5" r="4.5" fill="#ff6a3d"/>
</svg>
