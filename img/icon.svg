<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="fatmax">
  <!--
    fatmax のアイコン。**構成そのものを描いてある**（ハブ1つに複数のマシンがぶら下がる）。
    中央のオレンジがハブ、周りの青が各マシン。色は UI の --series-2 / --series-1 と同じ。

    # 16px に合わせて決めてある

    favicon は 16px まで縮む。**そこで潰れないことを最優先**にした。
    実際に 16/24/32/72 を並べて見比べて決めている（推測で決めていない）。

    - 衛星を隅まで広げた。中心に寄せると 16px で中心の丸と融合して「染み」になる
    - 線は 2.8。太いと 16px で点と繋がって塊になる。細いぶん小さいときは消えるが、
      **点だけでも読める**ようにしてあるので成立する
    - 要素は5つだけ。増やすと 16px で潰れる

    # 背景を自前で持つ理由

    透過にすると、ダークのタブでは濃い青と黒が沈んで輪郭が消える。
    タイルを敷けばライトでもダークでも同じに見える。
  -->
  <rect width="64" height="64" rx="14" fill="#1a1a19"/>
  <g stroke="#5a5954" stroke-width="2.8" stroke-linecap="round">
    <path d="M32 32 L14 14"/>
    <path d="M32 32 L50 14"/>
    <path d="M32 32 L14 50"/>
    <path d="M32 32 L50 50"/>
  </g>
  <g fill="#2a78d6">
    <circle cx="14" cy="14" r="7"/>
    <circle cx="50" cy="14" r="7"/>
    <circle cx="14" cy="50" r="7"/>
    <circle cx="50" cy="50" r="7"/>
  </g>
  <circle cx="32" cy="32" r="9.5" fill="#eb6834"/>
</svg>
